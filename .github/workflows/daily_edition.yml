name: 🗞️ Publish Daily CyberAI Edition

on:
  schedule:
    # Corre todos los días a las 11:10 AM UTC (08:10 AM ARG/CL/UY, 05:10 AM MX)
    # Minuto 10 evita la saturación habitual de servidores de GitHub en el minuto :00
    - cron: '10 11 * * *'
  workflow_dispatch: # Permite disparar la edición manualmente desde la pestaña Actions en GitHub

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Otorga permisos de escritura para hacer commit y push

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Ejecutar pipeline de noticias
        run: |
          python src/main.py

      - name: 💾 Commit y Push de la nueva edición
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || (git commit -m "📰 Edición Diaria: $(date +'%Y-%m-%d') [skip ci]" && git push)
