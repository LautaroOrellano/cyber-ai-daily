name: 🗞️ Publish Daily CyberAI Edition

on:
  schedule:
    # Corre de madrugada: 06:30 AM UTC (03:30 AM Argentina)
    # Horario con carga nula en servidores de GitHub, garantizando publicación antes de las 08:00 AM
    - cron: '30 6 * * *'
  workflow_dispatch: # Permite disparar la edición manualmente desde la pestaña Actions en GitHub

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Otorga permisos de escritura para hacer commit y push

    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Ejecutar pipeline de noticias
        run: |
          python src/main.py

      - name: 💾 Commit y Push de la nueva edición
        run: |
          git config --global user.name "Lautaro Orellano"
          git config --global user.email "Lautaa123@gmail.com"
          git add .
          git diff --staged --quiet || (git commit -m "📰 Edición Diaria: $(date +'%Y-%m-%d') [skip ci]" && git push)
